  }

    background: var(--bg);
    color: var(--text);

    padding-bottom: 60px;

  header {

    color: var(--accent-fg);

    position: sticky;
    top: 0;

    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 2px;
  }

  header p {
    font-size: 11px;
    opacity: 0.6;
    font-weight: 400;
  }

  .main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 0;
  }

  .step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .step-card.active {
    border-color: var(--accent);
  }

  .step-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .step-badge {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;
  }

  .step-badge.active { background: var(--accent); color: var(--accent-fg); }
  .step-badge.done { background: var(--green-bg); color: var(--green-text); }
  .step-badge.inactive { background: var(--border); color: var(--text-tertiary); }

  .step-label { font-size: 13px; font-weight: 500; }
  .step-value { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

  .chip-wrap {
    padding: 0 14px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .chip {
    padding: 7px 13px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }

  .chip:active { transform: scale(0.97); }

  .chip.selected {
    background: var(--chip-selected-bg);
    color: var(--chip-selected-fg);
    border-color: var(--chip-selected-bg);
  }

  .note-bar {
    margin: 0 14px 14px;
    padding: 9px 12px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.6;
    border-left: 3px solid var(--border-strong);
  }

  .result-card {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }

    background: var(--accent);
    color: var(--accent-fg);
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;

    justify-content: space-between;
    align-items: flex-start;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);

    font-size: 12px;
    color: var(--text-secondary);
    flex: 1;
    line-height: 1.5;
  }

  .result-row-price {
    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;
  }

    margin-top: 12px;

    justify-content: space-between;

    font-weight: 700;
    color: var(--accent-fg);
    font-family: 'DM Mono', monospace;

    border-radius: var(--radius-sm);
    font-size: 12px;
    color: var(--green-text);

  }

    border-radius: var(--radius);

    font-size: 11px;
    color: var(--text-tertiary);

// ── 獨協大学 B方式 state ───────────────────────────
// dokkyoSelections = { "外国語学部_英語学科": { normal: true, english: true } }
var dokkyoState = { expandedFaculty: null, selections: {} };
function resetDokkyoState() { dokkyoState = { expandedFaculty: null, selections: {} }; }

function toggleDokkyoExpand(faculty) {
  dokkyoState.expandedFaculty = dokkyoState.expandedFaculty === faculty ? null : faculty;
  render();
}

function toggleDokkyoMethod(faculty, dept, method) {
  var key = faculty + '_' + dept;
  if (!dokkyoState.selections[key]) dokkyoState.selections[key] = { normal: false, english: false };
  dokkyoState.selections[key][method] = !dokkyoState.selections[key][method];
  var s = dokkyoState.selections[key];
  if (!s.normal && !s.english) delete dokkyoState.selections[key];
  render();
}

function dokkyoFlatSelected() {
  var result = [];
  var count = 0;
  Object.entries(dokkyoState.selections).forEach(function(entry) {
    var key = entry[0], sel = entry[1];
    var parts = key.split('_');
    var faculty = parts[0], dept = parts.slice(1).join('_');
    if (sel.normal) {
      count++;
      var fee = count === 1 ? 35000 : count <= 3 ? 5000 : 5000;
      result.push({ name: faculty + '（' + dept + '）', fee: fee, count: count });
    }
    if (sel.english) {
      result.push({ name: faculty + '（' + dept + '）［外検＋：0円］', fee: 0 });
    }
  });
  return result;
}

function dokkyoCalcFees() {
  var normalCount = 0;
  var items = [];
  Object.entries(dokkyoState.selections).forEach(function(entry) {
    var key = entry[0], sel = entry[1];
    var parts = key.split('_');
    var faculty = parts[0], dept = parts.slice(1).join('_');
    if (sel.normal) {
      normalCount++;
      var fee;
      if (normalCount === 1) fee = 35000;
      else if (normalCount <= 3) fee = 5000;
      else fee = 5000;
      items.push(faculty + '（' + dept + '）');
    }
    if (sel.english) {
      items.push(faculty + '（' + dept + '）［外検＋：0円］');
    }
  });
  return items;
}

function renderDokkyoUI(mData) {
  var html = '<div style="padding:0 14px 14px;">';
  html += '<div style="margin:0 0 12px;padding:10px 12px;background:#E8F5E9;border:1px solid #81C784;border-radius:8px;font-size:11px;color:#1B5E20;line-height:1.7;">';
  html += '🎉 <strong>獨協大学B方式の割引ルール</strong><br>';
  html += '1学科目：35,000円 / 2〜3学科目：+5,000円 / 4学科目以降：+5,000円<br>';
  html += '外検＋方式：同一学科に<strong>無料（0円）</strong>で同時出願可能！';
  html += '</div>';

  var normalCount = 0;
  Object.values(dokkyoState.selections).forEach(function(s){ if(s.normal) normalCount++; });

  Object.entries(mData.faculties).forEach(function(entry) {
    var faculty = entry[0], depts = entry[1];
    var isExpanded = dokkyoState.expandedFaculty === faculty;
    var selCount = depts.filter(function(d){ return dokkyoState.selections[faculty + '_' + d]; }).length;
    var bg = isExpanded ? 'var(--accent)' : 'var(--bg)';
    var fg = isExpanded ? 'var(--accent-fg)' : 'var(--text)';
    var bd = isExpanded ? 'var(--accent)' : 'var(--border-strong)';
    html += '<div style="margin-bottom:8px;">';
    html += '<button data-action="dokkyoExpand" data-val="' + escA(faculty) + '" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:' + bg + ';color:' + fg + ';border:1px solid ' + bd + ';border-radius:8px;font-size:13px;cursor:pointer;text-align:left;">';
    html += '<span style="font-weight:500;">' + faculty + '</span>';
    html += '<span style="font-size:11px;opacity:0.8;">' + (selCount > 0 ? selCount + '学科 ' : '') + (isExpanded ? '▲' : '▶') + '</span>';
    html += '</button>';
    if (isExpanded) {
      html += '<div style="padding:8px 0 0 8px;">';
      depts.forEach(function(d) {
        var key = faculty + '_' + d;
        var sel = dokkyoState.selections[key] || { normal: false, english: false };
        html += '<div style="margin-bottom:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;">';
        html += '<div style="font-size:12px;font-weight:500;margin-bottom:8px;">' + d + '</div>';
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
        html += '<button class="chip ' + (sel.normal ? 'selected' : '') + '" data-action="dokkyoMethod" data-val="' + escA(faculty) + '" data-val2="' + escA(d) + '" data-val3="normal">通常方式</button>';
        html += '<button class="chip ' + (sel.english ? 'selected' : '') + '" data-action="dokkyoMethod" data-val="' + escA(faculty) + '" data-val2="' + escA(d) + '" data-val3="english">外検＋ ' + (sel.normal ? '<span style="color:#4CAF50;font-weight:700;">0円🎉</span>' : '0円') + '</button>';
        html += '</div></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Fee calculation ────────────────────────────────
function calcRows(univ, method, selected) {
  var m = DB[univ].methods[method];
  // 大東文化大学 グリーン出願（2つ目0円・3つ目以降+10,000円 or +5,000円）
  if (isDaitoGreen(univ, method)) {
    var isCommon = method.indexOf('共通テスト') >= 0;
    return selected.map(function(f, i) {
      var fee;
      if (i === 0) fee = isCommon ? 15000 : 35000;
      else if (i === 1) fee = 0;
      else fee = isCommon ? 5000 : 10000;
      return { name: f, fee: fee };
    });
  }
  // 東海大学 フラット併願（上限55,000円）
  if (isTokaiFlat(univ, method)) {
    var total = selected.length > 0 ? 35000 : 0;
    if (selected.length > 1) total = 55000;
    return selected.map(function(f, i) {
      return { name: f, fee: i === 0 ? 35000 : i === 1 ? 20000 : 0 };
    });
  }
  // 東海大学 共通テスト利用（一律15,000円）
  if (isTokaiCommon(univ, method)) {
    return selected.map(function(f, i) {
      return { name: f, fee: i === 0 ? 15000 : 0 };
    });
  }
  // 国士舘大学 +5,000円で併願し放題
  if (isKokushikanFlat(univ, method)) {
    var isCommonK = method.indexOf('共通テスト') >= 0;
    return selected.map(function(f, i) {
      var fee;
      if (i === 0) fee = isCommonK ? 15000 : 35000;
      else fee = isCommonK ? 5000 : 5000;
      return { name: f, fee: fee };
    });
  }
  // 芝浦工業大学共通テスト利用（4学科目以降0円）
  if (univ === '芝浦工業大学' && method === '共通テスト利用方式★4学科目以降0円') {
    return selected.map(function(f, i) {
      var fee = i === 0 ? 35000 : i < 3 ? 15000 : 0;
      return { name: f, fee: fee };
    });
  }
  // 獨協大学B方式専用計算
  if (isDokkyoB(univ, method)) {
    var normalCount = 0;
    return selected.map(function(f) {
      if (f.indexOf('外検＋') >= 0) return { name: f, fee: 0 };
      normalCount++;
      var fee = normalCount === 1 ? 35000 : normalCount <= 3 ? 5000 : 5000;
      return { name: f, fee: fee };
    });
  }
  // 國學院大學応援割専用計算
  if (isKokugakuinAV(univ, method)) {
    return selected.map(function(f) {
      var fee = f.indexOf('0円') >= 0 ? 0 : f.indexOf('V方式') >= 0 ? 15000 : 35000;
      return { name: f, fee: fee };
    });
  }
  // 武蔵大学専用計算
  if (isMusashiGeneral(univ, method)) {
    var faculties = {};
    return selected.map(function(f) {
      var match = f.match(/^(.+?)（/);
      if (!match) return { name: f, fee: 35000 };
      var faculty = match[1];
      if (!faculties[faculty]) { faculties[faculty] = 0; }
      faculties[faculty]++;
      var fee;
      if (Object.keys(faculties).length === 1 && faculties[faculty] === 1) fee = 35000;
      else if (faculties[faculty] > 1) fee = 0;
      else fee = 10000;
      return { name: f, fee: fee };
    });
  }
  // 専修大学スカラシップは専用計算
  if (isSenshuScholars(univ, method)) {
    return selected.map(function(f) {
      var fee = f.indexOf('0円') >= 0 ? 0 : 32000;
      return { name: f, fee: fee };
    });
  }
  // 東洋大学一般選抜は専用計算
  if (isToyoGeneral(univ, method)) {
    return selected.map(function(f) {
      var day = f.match(/【(.+?)】/);
      if (!day) return { name: f, fee: 35000 };
      var dayLabel = day[1];
      var dayItems = toyoState.selections[dayLabel] || [];
      var cleanName = f.replace(/【.+?】/, '');
      var idx = dayItems.indexOf(cleanName);
      var fee = idx === 0 ? 35000 : idx === 1 ? 0 : 20000;
      return { name: f, fee: fee };
    });
  }
  // 日大A+N連動方式は専用計算
  if (isNDUCombined(univ, method)) {
    return selected.map(function(f) {
      var fee = 0;
      if (f.indexOf('A個別') >= 0) fee = 35000;
      else if (f.indexOf('N全学：0円') >= 0) fee = 0;
      else if (f.indexOf('N全学') >= 0) fee = 18000;
      return { name: f, fee: fee };
    });
  }
  return selected.map(function(f, i) {
    var fee;
    if (i === 0) {
      fee = m.baseFee;
    } else if (univ === '東洋大学' && method === '一般入試（前期・同日併願）') {
      fee = i === 1 ? 0 : (m.thirdFee || 20000);
    } else if ((univ === '東洋大学' && method === '共通テスト利用（前期）') ||
               (univ === '駒澤大学' && method === '共通テスト利用（前期）')) {
      fee = i < 2 ? m.baseFee : (m.thirdFee || 9000);
    } else {
      fee = m.extraFee;
    }
    return { name: f, fee: fee };
  });
}

  var mData = DB[cur.university].methods[cur.method];
  var depts = mData.faculties[faculty];
  var allSelected = depts.every(function(d) {
    return cur.selected.includes(faculty + '（' + d + '）');

  if (allSelected) {
    depts.forEach(function(d) {
      var key = faculty + '（' + d + '）';
      var idx = cur.selected.indexOf(key);
      if (idx >= 0) cur.selected.splice(idx, 1);

  } else {
    depts.forEach(function(d) {
      var key = faculty + '（' + d + '）';
      if (!cur.selected.includes(key)) cur.selected.push(key);

function addToCart() {

    selected = hoseiToSelected();
  } else if (isChuoHybrid(cur.university, cur.method)) {
    selected = chuoToSelected();
  } else if (isRikkyo(cur.university)) {
    selected = rikkyoFlatSelected();
  } else if (isNDUCombined(cur.university, cur.method)) {
    selected = nduFlatSelected();
  } else if (isDokkyoB(cur.university, cur.method)) {
    selected = dokkyoCalcFees();
  } else if (isKokugakuinAV(cur.university, cur.method)) {
    selected = kokugakuinFlatSelected();
  } else if (isMusashiGeneral(cur.university, cur.method)) {
    selected = musashiFlatSelected();
  } else if (isSenshuScholars(cur.university, cur.method)) {
    selected = senshuFlatSelected();
  } else if (isToyoGeneral(cur.university, cur.method)) {
    selected = toyoFlatSelected();
  } else if (isAogakuAll(cur.university, cur.method)) {
    selected = aogakuAllSelected();
  } else if (isAogakuInd(cur.university, cur.method)) {
    selected = aogakuIndSelected();
  } else {
    selected = cur.selected;
  }
  if (selected.length === 0) return;
  var existing = cart.find(function(e){ return e.univ === cur.university && e.method === cur.method; });
  if (existing) {
    selected.forEach(function(f){ if (!existing.faculties.includes(f)) existing.faculties.push(f); });
  } else {
    cart.push({ univ: cur.university, method: cur.method, faculties: selected.slice() });
  }
  cur = { university: cur.university, method: null, selected: [], expandedFaculty: null };
  hoseiState = { expandedFaculty: null, selections: {} };
  rikkyoState = { expandedFaculty: null, selections: {} };
  chuoState = { expandedFaculty: null, selections: {} };

  resetNduState();
  resetToyoState();
  resetSenshuState();
  resetDokkyoState();
  resetKokugakuinState();
  resetMusashiState();
  render();
  setTimeout(function(){ var el = document.getElementById('cart-section'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 100);
}

        var sel = cur.university === u ? 'selected' : '';
        html += '<button class="chip ' + sel + '" data-action="selectUniv" data-val="' + escA(u) + '">' + u + '</button>';
      }
    });
    html += '</div></div>';
  });
  html += '</div>';

  // Step2: 入試方式
  if (cur.university) {
    var methods = Object.keys(DB[cur.university].methods);
    var s2done = !!cur.method;
    html += '<div class="step-card ' + (s2done ? '' : 'active') + '" id="step2">';
    html += '<div class="step-header">';
    html += '<div class="step-badge ' + (s2done ? 'done' : 'active') + '">' + (s2done ? '&#x2713;' : '2') + '</div>';
    html += '<div style="flex:1;"><div class="step-label">入試方式を選ぶ</div>';
    if (s2done) html += '<div class="step-value">' + cur.method + '</div>';
    html += '</div>';
    html += '<button data-action="backToStep1" style="font-size:11px;padding:4px 10px;background:none;border:1px solid var(--border-strong);border-radius:20px;cursor:pointer;color:var(--text-secondary);">&#x2190; 大学選択に戻る</button>';
    html += '</div><div class="chip-wrap">';
    methods.forEach(function(m) {
      var sel = cur.method === m ? 'selected' : '';
      html += '<button class="chip ' + sel + '" data-action="selectMethod" data-val="' + escA(m) + '"><span style="line-height:1.5">' + m + '</span></button>';
    });
    html += '</div></div>';
  }

  // Step3: 学部学科
  if (cur.method) {
    var mData = DB[cur.university].methods[cur.method];
    var hoseiT = isHoseiT(cur.university, cur.method);
    var chuoH = isChuoHybrid(cur.university, cur.method);
    var rikkyoR = isRikkyo(cur.university);
    var nduC = isNDUCombined(cur.university, cur.method);
    var dokkyoB = isDokkyoB(cur.university, cur.method);
    var kokugakuinAV = isKokugakuinAV(cur.university, cur.method);
    var musashiG = isMusashiGeneral(cur.university, cur.method);
    var senshuS = isSenshuScholars(cur.university, cur.method);
    var toyoG = isToyoGeneral(cur.university, cur.method);
    var aogakuA = isAogakuAll(cur.university, cur.method);
    var aogakuI = isAogakuInd(cur.university, cur.method);
    var hoseiSel = hoseiToSelected();
    var chuoSel = chuoToSelected();
    var rikkyoSel = rikkyoFlatSelected();
    var nduSel = nduFlatSelected();
    var dokkyoSel = dokkyoCalcFees();
    var kokugakuinSel = kokugakuinFlatSelected();
    var musashiSel = musashiFlatSelected();
    var senshuSel = senshuFlatSelected();
    var toyoSel = toyoFlatSelected();
    var aogakuSel = aogakuA ? aogakuAllSelected() : aogakuI ? aogakuIndSelected() : [];
    var s3done = hoseiT ? hoseiSel.length > 0 : chuoH ? chuoSel.length > 0 : rikkyoR ? rikkyoSel.length > 0 : nduC ? nduSel.length > 0 : dokkyoB ? dokkyoSel.length > 0 : kokugakuinAV ? kokugakuinSel.length > 0 : musashiG ? musashiSel.length > 0 : senshuS ? senshuSel.length > 0 : toyoG ? toyoSel.length > 0 : (aogakuA || aogakuI) ? aogakuSel.length > 0 : cur.selected.length > 0;
    var count3 = hoseiT ? hoseiSel.length : chuoH ? chuoSel.length : rikkyoR ? rikkyoSel.length : nduC ? nduSel.length : dokkyoB ? dokkyoSel.length : kokugakuinAV ? kokugakuinSel.length : musashiG ? musashiSel.length : senshuS ? senshuSel.length : toyoG ? toyoSel.length : (aogakuA || aogakuI) ? aogakuSel.length : cur.selected.length;
    var isAday = cur.university === '法政大学' && cur.method === 'A日程（個別日程）';

    html += '<div class="step-card ' + (s3done ? '' : 'active') + '" id="step3">';
    html += '<div class="step-header">';
    html += '<div class="step-badge ' + (s3done ? 'done' : 'active') + '">' + (s3done ? '&#x2713;' : '3') + '</div>';
    html += '<div style="flex:1;"><div class="step-label">学部・学科を選ぶ（複数選択可）</div>';
    if (s3done) html += '<div class="step-value">' + count3 + '件選択中</div>';
    html += '</div>';
    html += '<button data-action="backToStep2" style="font-size:11px;padding:4px 10px;background:none;border:1px solid var(--border-strong);border-radius:20px;cursor:pointer;color:var(--text-secondary);">&#x2190; 方式選択に戻る</button>';
    html += '</div>';
    html += '<div class="note-bar">' + mData.note + '</div>';

    // 全大学共通：試験日重複注意＋製品版誘導
    html += '<div style="margin:0 14px 12px;padding:10px 12px;background:#FFF3E0;border:1px solid #FFB74D;border-radius:8px;font-size:11px;color:#E65100;line-height:1.7;">';
    html += '&#x26A0;&#xFE0F; <strong>試験日の重複にご注意ください</strong><br>';
    html += '同一日に複数の試験が重なっている場合、実際には受験できない可能性があります。<br>';
    html += '必ず各大学の公式サイトで試験日をご確認ください。<br>';
    html += '&#x1F512; <strong style="color:#BF360C;">製品版では試験日の重複を自動チェックする機能を追加予定です。</strong>';
    html += '</div>';

    if (isAday) {
      html += '<div style="margin:0 14px 12px;padding:10px 12px;background:#FFF8E1;border:1px solid #FFD54F;border-radius:8px;font-size:11px;color:#5D4037;line-height:1.7;">';
      html += '&#x26A0;&#xFE0F; <strong>A日程（個別日程）について</strong><br>';
      html += '学部ごとに試験日が異なります。同一日程の学部のみ併願可能です。<br>';
      html += '日程の重複確認は各大学の公式サイトをご確認ください。';
      html += '</div>';
    }

    if (hoseiT) {
      html += renderHoseiTUI(mData);
    } else if (chuoH) {
      html += renderChuoHybridUI(mData);
    } else if (rikkyoR) {
      html += renderRikkyoUI(mData);
    } else if (nduC) {
      html += renderNduUI(mData);
    } else if (dokkyoB) {
      html += renderDokkyoUI(mData);
    } else if (kokugakuinAV) {
      html += renderKokugakuinUI(mData);
    } else if (musashiG) {
      html += renderMusashiUI(mData);
    } else if (senshuS) {
      html += renderSenshuUI(mData);
    } else if (toyoG) {
      html += renderToyoUI(mData);
    } else if (aogakuA) {
      html += renderAogakuAllUI(mData);
    } else if (aogakuI) {
      html += renderAogakuIndUI(mData);
    } else if (mData.selectAll) {
      html += renderSelectAllUI(mData);
    } else {
      html += renderFacultyUI(mData);
    }

    if (s3done) {
      var previewSelected = hoseiT ? hoseiSel : chuoH ? chuoSel : rikkyoR ? rikkyoSel : nduC ? nduSel : dokkyoB ? dokkyoSel : kokugakuinAV ? kokugakuinSel : musashiG ? musashiSel : senshuS ? senshuSel : toyoG ? toyoSel : (aogakuA || aogakuI) ? aogakuSel : cur.selected;
      var previewRows = calcRows(cur.university, cur.method, previewSelected);
      var previewTotal = previewRows.reduce(function(s,r){ return s+r.fee; }, 0);
      var previewNormal = 35000 * previewSelected.length;
      var previewSaved = previewNormal - previewTotal;

      html += '<div style="margin:0 14px 14px;padding:12px 14px;background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;">';
      html += '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;font-weight:500;">&#x1F4CA; この大学の選択中小計</div>';
      previewRows.forEach(function(r, i) {
        html += '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;">';
        html += '<span style="color:var(--text-secondary);">' + (i+1) + '. ' + r.name + '</span>';
        html += '<span style="font-weight:500;">' + fmt(r.fee) + '</span></div>';
      });
      html += '<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:13px;font-weight:700;">';
      html += '<span>' + previewSelected.length + '出願 小計</span>';
      html += '<span>' + fmt(previewTotal) + '</span></div>';
      if (previewSaved > 0) {
        html += '<div style="margin-top:6px;font-size:11px;color:var(--green-text);">&#x1F389; 割引で ' + fmt(previewSaved) + ' 節約！</div>';
      }
      html += '</div>';
      html += '<button data-action="addToCart" style="width:100%;padding:14px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:var(--radius);font-size:14px;font-family:\'Noto Sans JP\',sans-serif;font-weight:700;cursor:pointer;margin-bottom:12px;">+ 受験リストに追加する</button>';
    }

    html += '</div>';
  }

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
