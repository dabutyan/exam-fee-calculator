  }

    margin: 0 auto;
    padding: 16px 16px 0;

  .step-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s;

  .step-card.active {

  }

  .step-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;

    width: 26px;

    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: 'DM Mono', monospace;

  .step-badge.active { background: var(--accent); color: var(--accent-fg); }
  .step-badge.done { background: var(--green-bg); color: var(--green-text); }
  .step-badge.inactive { background: var(--border); color: var(--text-tertiary); }

  .step-label { font-size: 13px; font-weight: 500; }
  .step-value { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

  .chip-wrap {
    padding: 0 14px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .chip {
    padding: 7px 13px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1.4;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }

  .chip:active { transform: scale(0.97); }

  .chip.selected {
    background: var(--chip-selected-bg);
    color: var(--chip-selected-fg);
    border-color: var(--chip-selected-bg);
  }

  .note-bar {
    margin: 0 14px 14px;
    padding: 9px 12px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.6;
    border-left: 3px solid var(--border-strong);
  }

  .result-card {
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
  }

  .result-header {
    background: var(--accent);
    color: var(--accent-fg);
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;
  }

    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .result-row-label {
    font-size: 12px;
    color: var(--text-secondary);
    flex: 1;
    line-height: 1.5;
  }

  .result-row-price {
    font-size: 13px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }

    margin-top: 12px;
    padding: 14px;

    justify-content: space-between;

    color: var(--accent-fg);

    text-align: center;

// カート：[{ univ, method, faculties }]
let cart = [];
let cur = { university: null, method: null, selected: [] };

function fmt(n) { return n.toLocaleString('ja-JP') + '円'; }

function calcRows(univ, method, selected) {
  const m = DB[univ].methods[method];
  return selected.map((f, i) => {
    let fee;
    if (i === 0) {
      fee = m.baseFee;
    } else if (univ === "東洋大学" && method === "一般入試（前期・同日併願）") {
      fee = i === 1 ? 0 : (m.thirdFee || 20000);
    } else if ((univ === "東洋大学" && method === "共通テスト利用（前期）") ||
               (univ === "駒澤大学" && method === "共通テスト利用（前期）")) {
      fee = i < 2 ? m.baseFee : (m.thirdFee || 9000);
    } else {
      fee = m.extraFee;
    }
    return { name: f, fee };
  });
}

function cartTotal() {
  return cart.reduce((sum, entry) => {
    return sum + calcRows(entry.univ, entry.method, entry.faculties).reduce((s, r) => s + r.fee, 0);
  }, 0);
}

function cartCount() {
  return cart.reduce((s, e) => s + e.faculties.length, 0);
}

function addToCart() {
  if (!cur.university || !cur.method || cur.selected.length === 0) return;
  const existing = cart.find(e => e.univ === cur.university && e.method === cur.method);
  if (existing) {
    cur.selected.forEach(f => { if (!existing.faculties.includes(f)) existing.faculties.push(f); });
  } else {
    cart.push({ univ: cur.university, method: cur.method, faculties: [...cur.selected] });
  }
  cur = { university: cur.university, method: null, selected: [] };
  render();
  setTimeout(() => {
    document.getElementById('cart-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  render();
}

function removeFaculty(cartIdx, fac) {
  cart[cartIdx].faculties = cart[cartIdx].faculties.filter(f => f !== fac);
  if (cart[cartIdx].faculties.length === 0) cart.splice(cartIdx, 1);
  render();
}

function resetAll() {
  cart = [];
  cur = { university: null, method: null, selected: [] };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectUniv(u) {
  cur = { university: u, method: null, selected: [] };
  render();
  setTimeout(() => document.getElementById('step2')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function selectMethod(m) {
  cur.method = m;
  cur.selected = [];
  render();
  setTimeout(() => document.getElementById('step3')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function toggleFaculty(f) {
  const idx = cur.selected.indexOf(f);
  if (idx >= 0) cur.selected.splice(idx, 1);
  else cur.selected.push(f);
  render();
}

function render() {
  const app = document.getElementById('app');
  const univs = Object.keys(DB);
  let html = '';

  if (cart.length > 0) {
    const total = cartTotal();
    const normalTotal = cartCount() * 35000;
    const saved = normalTotal - total;
    html += `<div class="result-card" id="cart-section">
      <div class="result-header">&#x1F9FE; 受験リスト・合計金額</div>
      <div class="result-body">`;
    cart.forEach((entry, ci) => {
      const rows = calcRows(entry.univ, entry.method, entry.faculties);
      const subtotal = rows.reduce((s, r) => s + r.fee, 0);
      html += `<div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div style="font-size:13px;font-weight:700;">${entry.univ}</div>
          <div style="font-size:11px;color:var(--text-secondary);">${entry.method}</div>
        </div>`;
      rows.forEach((r, ri) => {
        html += `<div class="result-row">
          <div class="result-row-label" style="display:flex;align-items:center;gap:6px;">
            <button onclick="removeFaculty(${ci},'${r.name.replace(/'/g,"\\'")}')" style="background:none;border:none;cursor:pointer;color:var(--text-tertiary);font-size:14px;padding:0;line-height:1;">&#x00D7;</button>
            ${ri + 1}. ${r.name}
          </div>
          <div class="result-row-price">${fmt(r.fee)}</div>
        </div>`;
      });
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0 0;font-size:12px;color:var(--text-secondary);">
        <span>${entry.faculties.length}出願 小計</span>
        <span style="font-weight:700;color:var(--text);">${fmt(subtotal)}</span>
      </div>
      <button onclick="removeFromCart(${ci})" style="margin-top:8px;width:100%;padding:6px;font-size:11px;background:none;border:1px solid var(--border-strong);border-radius:6px;cursor:pointer;color:var(--text-secondary);">この大学を削除</button>
      </div><div style="height:1px;background:var(--border);margin:8px 0 14px;"></div>`;
    });
    html += `<div class="result-total">
        <div class="result-total-label">全${cartCount()}出願 合計</div>
        <div class="result-total-price">${fmt(total)}</div>
      </div>
      ${saved > 0 ? `<div class="savings-bar">&#x1F389; 割引で ${fmt(saved)} 節約！</div>` : ''}
      </div></div>
    <button class="reset-btn" onclick="resetAll()">&#x21A9; 全部リセット</button>`;
  }

  const s1done = !!cur.university;
  html += `<div class="step-card ${!s1done ? 'active' : ''}">
    <div class="step-header">
      <div class="step-badge ${s1done ? 'done' : 'active'}">${s1done ? '&#x2713;' : '1'}</div>
      <div>
        <div class="step-label">${cart.length > 0 ? '大学を追加する' : '大学を選ぶ'}</div>
        ${s1done ? `<div class="step-value">${cur.university}</div>` : ''}
      </div>
    </div>
    <div class="chip-wrap">
      ${univs.map(u => `<button class="chip ${cur.university === u ? 'selected' : ''}" onclick="selectUniv('${u}')">${u}</button>`).join('')}
    </div>
  </div>`;

  if (cur.university) {
    const methods = Object.keys(DB[cur.university].methods);
    const s2done = !!cur.method;
    html += `<div class="step-card ${s2done ? '' : 'active'}" id="step2">
      <div class="step-header">
        <div class="step-badge ${s2done ? 'done' : 'active'}">${s2done ? '&#x2713;' : '2'}</div>
        <div>
          <div class="step-label">入試方式を選ぶ</div>
          ${s2done ? `<div class="step-value">${cur.method}</div>` : ''}
        </div>
      </div>
      <div class="chip-wrap">
        ${methods.map(m => `<button class="chip ${cur.method === m ? 'selected' : ''}" onclick="selectMethod('${m.replace(/'/g, "\\'")}')"><span style="line-height:1.5">${m}</span></button>`).join('')}
      </div>
    </div>`;
  }

  if (cur.method) {
    const mData = DB[cur.university].methods[cur.method];
    const s3done = cur.selected.length > 0;
    html += `<div class="step-card ${s3done ? '' : 'active'}" id="step3">
      <div class="step-header">
        <div class="step-badge ${s3done ? 'done' : 'active'}">${s3done ? '&#x2713;' : '3'}</div>
        <div>
          <div class="step-label">学部・学科を選ぶ（複数選択可）</div>
          ${s3done ? `<div class="step-value">${cur.selected.length}件選択中</div>` : ''}
        </div>
      </div>
      <div class="note-bar">${mData.note}</div>
      <div class="chip-wrap">
        ${mData.faculties.map(f => `<button class="chip ${cur.selected.includes(f) ? 'selected' : ''}" onclick="toggleFaculty('${f.replace(/'/g, "\\'")}')"><span style="line-height:1.5">${f}</span></button>`).join('')}
      </div>
    </div>`;
    if (s3done) {
      html += `<button onclick="addToCart()" style="width:100%;padding:14px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:var(--radius);font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;margin-bottom:12px;">+ 受験リストに追加する</button>`;
    }
  }

  app.innerHTML = html;
}

render();

function selectUniv(u) {
  state = { university: u, method: null, selected: [] };
  render();
  setTimeout(() => {
    const el = document.getElementById('step2');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function selectMethod(m) {
  state.method = m;
  state.selected = [];
  render();
  setTimeout(() => {
    const el = document.getElementById('step3');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

function toggleFaculty(f) {
  const idx = state.selected.indexOf(f);
  if (idx >= 0) state.selected.splice(idx, 1);
  else state.selected.push(f);
  render();
}

function reset() {
  state = { university: null, method: null, selected: [] };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function fmt(n) {
  return n.toLocaleString('ja-JP') + '円';
}

function render() {
  const app = document.getElementById('app');
  const univs = Object.keys(DB);
  let html = '';

  // Step 1
  const s1done = !!state.university;
  html += `<div class="step-card ${!s1done ? 'active' : ''}">
    <div class="step-header">
      <div class="step-badge ${s1done ? 'done' : 'active'}">${s1done ? '✓' : '1'}</div>
      <div>
        <div class="step-label">大学を選ぶ</div>
        ${s1done ? `<div class="step-value">${state.university}</div>` : ''}
      </div>
    </div>
    <div class="chip-wrap">
      ${univs.map(u => `<button class="chip ${state.university === u ? 'selected' : ''}" onclick="selectUniv('${u}')">${u}</button>`).join('')}
    </div>
  </div>`;

  // Step 2
  if (state.university) {
    const methods = Object.keys(DB[state.university].methods);
    const s2done = !!state.method;
    html += `<div class="step-card ${s2done ? '' : 'active'}" id="step2">
      <div class="step-header">
        <div class="step-badge ${s2done ? 'done' : 'active'}">${s2done ? '✓' : '2'}</div>
        <div>
          <div class="step-label">入試方式を選ぶ</div>
          ${s2done ? `<div class="step-value">${state.method}</div>` : ''}
        </div>
      </div>
      <div class="chip-wrap">
        ${methods.map(m => `<button class="chip ${state.method === m ? 'selected' : ''}" onclick="selectMethod('${m.replace(/'/g, "\\'")}')"><span style="line-height:1.5">${m}</span></button>`).join('')}
      </div>
    </div>`;
  }

  // Step 3
  if (state.method) {
    const mData = DB[state.university].methods[state.method];
    const s3done = state.selected.length > 0;
    html += `<div class="step-card ${s3done ? '' : 'active'}" id="step3">
      <div class="step-header">
        <div class="step-badge ${s3done ? 'done' : 'active'}">${s3done ? '✓' : '3'}</div>
        <div>
          <div class="step-label">学部・学科を選ぶ（複数選択可）</div>
          ${s3done ? `<div class="step-value">${state.selected.length}件選択中</div>` : ''}
        </div>
      </div>
      <div class="note-bar">${mData.note}</div>
      <div class="chip-wrap">
        ${mData.faculties.map(f => `<button class="chip ${state.selected.includes(f) ? 'selected' : ''}" onclick="toggleFaculty('${f.replace(/'/g, "\\'")}')"><span style="line-height:1.5">${f}</span></button>`).join('')}
      </div>
    </div>`;
  }

  // Result
  if (state.selected.length > 0) {
    const rows = calcFee(state.university, state.method, state.selected);
    const total = rows.reduce((s, r) => s + r.fee, 0);
    const normalTotal = 35000 * state.selected.length;
    const saved = normalTotal - total;

    html += `<div class="result-card">
      <div class="result-header">受験料シミュレーション結果</div>
      <div class="result-body">
        ${rows.map((r, i) => `
          <div class="result-row">
            <div class="result-row-label">${i + 1}. ${r.name}</div>
            <div class="result-row-price">${fmt(r.fee)}</div>
          </div>`).join('')}
        <div class="result-total">
          <div class="result-total-label">${state.selected.length}出願 合計</div>
          <div class="result-total-price">${fmt(total)}</div>
        </div>
        ${saved > 0 ? `<div class="savings-bar">🎉 割引で ${fmt(saved)} 節約！</div>` : ''}
      </div>
    </div>`;

    html += `<button class="reset-btn" onclick="reset()">↩ 最初からやり直す</button>`;
  }

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
